unit_test:
  go:
    condition_coverage: true
    commands:
      - "set -x && unset HTTPS_PROXY && unset HTTP_PROXY && bash ./gen_coverage.sh"

coverage_threshold:
  # 覆盖率计算范围（需使用 /** 匹配文件夹）
  include_patterns:
    - "app/**"
    - "engine/**"
    - "internal/**"
    - "common/**"

  # 排除范围（不计算覆盖率）
  exclude_patterns:
    # 第三方代码
    - "internal/third_party/**"
    - "engine/third_party/**"
    - "engine/dal/**"
    - "internal/dal/**"

    # TCC 相关（业务逻辑已单独覆盖）
    - "app/common/tcc/**"
    - "app/common/tcc/tcc_copy_automation.go"
    - "app/common/tcc/fe_tcc/fe_tcc.go"
    - "app/common/tcc/fe_tcc/fe_tcc_config.go"
    - "app/common/tcc/tcc.go"
    - "app/common/tcc/tcc_config.go"

    # 升级/迁移相关
    - "engine/gray/action_migration_gray/**"
    - "app/engine/upgrade/repo/**"
    - "app/engine/upgrade/cache/**"
    - "app/engine/upgrade/transfer/**"
    - "app/engine/repo/**"
    - "app/flow_logic/repo/**"

    # 监控/机器人
    - "common/monitor_engine/**"
    - "common/lark_bot/**"

    # 自动生成/Mock 代码
    - "*_mock.go"
    - "kitex_gen/**"
    - "mock/**"
    - "handler.go"

    # 其他
    - "go.mod"
    - "app/intergration/**"

  # 覆盖率指标阈值
  line_percent: 40
  statement_percent: 40
  diff_percent: 80
  diff_condition_percent: 60
